name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  industrial_ci:
    strategy:
      fail-fast: false
      matrix:
        env:
          - ROS_DISTRO: jazzy
            ROS_REPO: main
          - ROS_DISTRO: humble
            ROS_REPO: main
          # Rolling is only published to the testing repo; the sync to main
          # happens per released distro, so main has no ros-rolling-* packages.
          - ROS_DISTRO: rolling
            ROS_REPO: testing

    env:
      CCACHE_DIR: /github/home/.ccache
      TARGET_CMAKE_ARGS: -DWARNINGS_AS_ERRORS=ON

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This step will fetch/store the directory used by ccache before/after the ci run
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.env.ROS_DISTRO }}-${{ matrix.env.ROS_REPO }}
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{ matrix.env }}
